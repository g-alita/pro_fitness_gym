<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set Password - Pro Fitness Gym</title>
  <link rel="stylesheet" href="signin.css" />
</head>
<body>
  <div class="blur-overlay"></div>
  <main class="container">
    <div class="logo">
      <img src="photos/logo.png" alt="Pro Fitness Logo" style="width: 150px; height: auto;">
      <h1>Pro Fitness Gym</h1>
    </div>
    <h2 id="resetHeading">Set or reset your password</h2>
    <form class="signin-form" id="passwordResetForm">
      <input type="password" id="newPassword" placeholder="New password (at least 8 characters)" autocomplete="new-password" minlength="8" maxlength="128" required />
      <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" minlength="8" maxlength="128" required />
      <button type="submit">SAVE PASSWORD</button>
      <p id="resetStatus" class="auth-status" role="status" aria-live="polite"></p>
      <div class="links">
        <a id="backToSignIn" href="signin-user.html">Back to sign in</a>
      </div>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const accountType = params.get('type');
    const status = document.getElementById('resetStatus');
    const isValidLink = typeof token === 'string' && /^[a-f0-9]{64}$/.test(token) &&
      ['user', 'admin'].includes(accountType);

    if (accountType === 'admin') {
      document.getElementById('backToSignIn').href = 'signin-admin.html';
      document.getElementById('resetHeading').textContent = 'Set or reset your admin password';
    }

    if (!isValidLink) {
      status.textContent = 'This password setup link is invalid. Request a new link from the sign-in page.';
      document.querySelector('#passwordResetForm button').disabled = true;
    }

    document.getElementById('passwordResetForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;
      if (password !== confirmation) {
        status.textContent = 'The passwords do not match.';
        return;
      }

      status.textContent = 'Saving your password...';
      try {
        const response = await fetch('/api/auth/password/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || 'Unable to set your password.');
        }
        status.textContent = result.message;
        document.querySelector('#passwordResetForm button').disabled = true;
      } catch (error) {
        console.error('Password setup failed:', error);
        status.textContent = error.message || 'Unable to set your password. Please try again.';
      }
    });
  </script>
</body>
</html>
