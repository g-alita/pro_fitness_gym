<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Sign In - Pro Fitness Gym</title>
  <link rel="stylesheet" href="signin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div class="blur-overlay"></div>
  <div class="container user-signin-container">
    <div class="logo">
      <img src="photos/logo.png" alt="Pro Fitness Logo" style="width: 150px; height: auto;">
      <h1>Pro Fitness Gym</h1>
    </div>
    <h2><i class="fas fa-user"></i> SIGN IN AS USER</h2>

    <div class="signin-form admin-signin-form">
      <div class="admin-login-tabs" role="tablist" aria-label="User sign-in method">
        <button type="button" class="admin-login-tab active" id="userEmailTab" role="tab"
          aria-selected="true" aria-controls="userEmailPanel">
          <i class="fas fa-envelope"></i> Email
        </button>
        <button type="button" class="admin-login-tab" id="userPhoneTab" role="tab"
          aria-selected="false" aria-controls="userPhonePanel">
          <i class="fas fa-mobile-alt"></i> Phone
        </button>
      </div>

      <div class="admin-login-options">
        <section class="admin-login-panel" id="userEmailPanel" role="tabpanel" aria-labelledby="userEmailTab">
          <h3><i class="fas fa-envelope"></i> Email OTP sign in</h3>
          <form id="userSignInForm">
            <input type="email" id="userEmail" placeholder="Email address" autocomplete="email" required />
            <button type="submit" id="requestEmailOtpButton">SEND SIGN-IN CODE</button>
            <input type="text" id="userEmailOtp" placeholder="6-digit email code"
              autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}"
              minlength="6" maxlength="6" aria-label="Email sign-in code" hidden />
            <button type="button" id="verifyUserEmailOtp" hidden>VERIFY CODE AND SIGN IN</button>
            <p id="emailOtpStatus" class="auth-status" role="status" aria-live="polite"></p>
          </form>

          <div class="google-signin-section">
            <div class="auth-divider"><span>OR</span></div>
            <div id="googleSignInButton" class="google-signin-button"></div>
            <p id="googleSignInStatus" class="google-signin-status" role="status" aria-live="polite"></p>
          </div>

          <div class="links">
            <p>Don't have an account? <a href="contact.html">Sign up</a></p>
          </div>
        </section>

        <section class="admin-login-panel" id="userPhonePanel" role="tabpanel" aria-labelledby="userPhoneTab" hidden>
          <h3><i class="fas fa-mobile-alt"></i> WhatsApp sign in</h3>
          <input type="tel" id="userPhone" placeholder="Phone (10 digits or +91XXXXXXXXXX)" autocomplete="tel"
            inputmode="tel" pattern="(\+91)?[6-9][0-9]{9}" minlength="10" maxlength="13"
            aria-label="User phone number" />
          <button type="button" id="requestUserPhoneOtp">SEND WHATSAPP CODE</button>
          <input type="text" id="userPhoneOtp" placeholder="6-digit WhatsApp code"
            autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}"
            minlength="6" maxlength="6" aria-label="WhatsApp sign-in code" hidden />
          <button type="button" id="verifyUserPhoneOtp" hidden>VERIFY CODE AND SIGN IN</button>
          <p id="userPhoneOtpStatus" class="auth-status" role="status" aria-live="polite"></p>
          <p class="google-signin-status">Only numbers in the user number collection can sign in.</p>
        </section>
      </div>

      <div class="links">
        <p><a href="gym.html"><i class="fas fa-home"></i> Back to Home</a></p>
      </div>
    </div>
  </div>

  <script src="api-config.js"></script>
  <script src="google-login.js"></script>
  <script src="phone-login.js"></script>
  <script>
    function showUserLoginPanel(method) {
      const emailSelected = method === 'email';
      document.getElementById('userEmailPanel').hidden = !emailSelected;
      document.getElementById('userPhonePanel').hidden = emailSelected;
      document.getElementById('userEmailTab').classList.toggle('active', emailSelected);
      document.getElementById('userPhoneTab').classList.toggle('active', !emailSelected);
      document.getElementById('userEmailTab').setAttribute('aria-selected', String(emailSelected));
      document.getElementById('userPhoneTab').setAttribute('aria-selected', String(!emailSelected));
    }

    document.getElementById('userEmailTab').addEventListener('click', function() {
      showUserLoginPanel('email');
    });

    document.getElementById('userPhoneTab').addEventListener('click', function() {
      showUserLoginPanel('phone');
    });

    document.getElementById('userSignInForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('userEmail').value.trim();
      const button = document.getElementById('requestEmailOtpButton');
      const status = document.getElementById('emailOtpStatus');
      status.textContent = 'Requesting a sign-in code...';
      button.disabled = true;

      try {
        const response = await window.proFitnessApiFetch('/api/auth/email/user/request-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || 'Unable to send a sign-in code.');
        }

        document.getElementById('userEmailOtp').hidden = false;
        document.getElementById('verifyUserEmailOtp').hidden = false;
        document.getElementById('userEmailOtp').focus();
        status.textContent = result.message;
      } catch (error) {
        console.error('User email sign-in code request failed:', error);
        status.textContent = error.message || 'Unable to send a sign-in code. Please try again.';
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('verifyUserEmailOtp').addEventListener('click', async function() {
      const email = document.getElementById('userEmail').value.trim();
      const code = document.getElementById('userEmailOtp').value.trim();
      const button = this;
      const status = document.getElementById('emailOtpStatus');
      status.textContent = 'Verifying sign-in code...';
      button.disabled = true;

      try {
        const response = await window.proFitnessApiFetch('/api/auth/email/user/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || 'Sign-in code verification failed.');
        }

        localStorage.setItem('userLoggedIn', 'true');
        localStorage.setItem('userEmail', result.email);
        localStorage.removeItem('userPhone');
        localStorage.removeItem('adminLoggedIn');
        localStorage.removeItem('adminEmail');
        localStorage.removeItem('adminPhone');
        window.location.href = 'gym.html';
      } catch (error) {
        console.error('User email sign-in code verification failed:', error);
        status.textContent = error.message || 'Unable to sign in. Please try again.';
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('userEmailOtp').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        document.getElementById('verifyUserEmailOtp').click();
      }
    });

    window.initializePhoneOtpLogin('user');
    window.initializeGoogleSignIn('user');
  </script>
</body>
</html>
