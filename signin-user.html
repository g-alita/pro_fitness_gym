<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Sign In - Pro Fitness Gym</title>
  <link rel="stylesheet" href="signin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div class="blur-overlay"></div>
  <div class="container">
    <div class="logo">
      <img src="photos/logo.png" alt="Pro Fitness Logo" style="width: 150px; height: auto;">
      <h1>Pro Fitness Gym</h1>
    </div>
    <h2><i class="fas fa-user"></i> SIGN IN AS USER</h2>

    <form class="signin-form" id="userSignInForm">
      <input type="email" id="userEmail" placeholder="Email address" required />

      <div class="password-wrapper">
        <input type="password" placeholder="Password" id="userPassword" required />
        <span class="toggle" onclick="togglePassword('userPassword')">
          <i class="fas fa-eye" id="userPasswordToggle"></i>
        </span>
      </div>

      <button type="submit">SIGN IN</button>

      <div class="google-signin-section">
        <div class="auth-divider"><span>OR</span></div>
        <div id="googleSignInButton"></div>
        <p id="googleSignInStatus" class="google-signin-status" role="status" aria-live="polite"></p>
      </div>

      <div class="links">
        <a href="#">Forgot password?</a>
        <p>Don't have an account? <a href="contact.html">Sign up</a></p>
        <p><a href="gym.html"><i class="fas fa-home"></i> Back to Home</a></p>
      </div>
    </form>
  </div>

  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const toggle = document.getElementById(inputId + 'Toggle');
      if (input.type === 'password') {
        input.type = 'text';
        toggle.classList.remove('fa-eye');
        toggle.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        toggle.classList.remove('fa-eye-slash');
        toggle.classList.add('fa-eye');
      }
    }

    document.getElementById('userSignInForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('userEmail').value;
      const password = document.getElementById('userPassword').value;
      
      // Email format validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        alert('Invalid email format.');
        return;
      }
      if (password.length < 8) {
        alert('Password must be at least 8 characters.');
        return;
      }

      // Save login state
      localStorage.setItem('userLoggedIn', 'true');
      localStorage.setItem('userEmail', email);
      localStorage.removeItem('adminLoggedIn');
      
      // Redirect to home page
      window.location.href = 'gym.html';
    });

    function loadGoogleIdentityServices() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://accounts.google.com/gsi/client';
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Google sign-in could not be loaded. Please try again later.'));
        document.head.appendChild(script);
      });
    }

    async function handleGoogleCredential(response) {
      const status = document.getElementById('googleSignInStatus');
      status.textContent = 'Verifying your Google account...';

      try {
        const verificationResponse = await fetch('/api/auth/google/user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const result = await verificationResponse.json();
        if (!verificationResponse.ok) {
          throw new Error(result.message || 'Google sign-in failed.');
        }

        localStorage.setItem('userLoggedIn', 'true');
        localStorage.setItem('userEmail', result.email);
        localStorage.removeItem('adminLoggedIn');
        window.location.href = 'gym.html';
      } catch (error) {
        console.error('Google user sign-in failed:', error);
        status.textContent = error.message || 'Google sign-in failed. Please try again.';
      }
    }

    async function initializeGoogleSignIn() {
      const status = document.getElementById('googleSignInStatus');

      try {
        const configResponse = await fetch('/api/auth/google/config');
        const config = await configResponse.json();
        if (!configResponse.ok) {
          throw new Error(config.message || 'Google sign-in is not configured.');
        }

        await loadGoogleIdentityServices();
        google.accounts.id.initialize({
          client_id: config.clientId,
          callback: handleGoogleCredential
        });
        google.accounts.id.renderButton(document.getElementById('googleSignInButton'), {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          text: 'continue_with',
          shape: 'rectangular',
          logo_alignment: 'left',
          width: Math.min(300, document.getElementById('googleSignInButton').clientWidth)
        });
      } catch (error) {
        console.error('Unable to initialize Google user sign-in:', error);
        status.textContent = error.message || 'Google sign-in could not be initialized.';
      }
    }

    initializeGoogleSignIn();
  </script>
</body>
</html>
