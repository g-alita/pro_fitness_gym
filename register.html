<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Pro Fitness Gym</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
   <div class="register-wrapper">
        <div class="register-image">
            <!-- Leave this div empty for now; you can add an image or illustration later -->
        </div>
        <div class="register-form-container">
            <form class="register-form" id="registerForm">
                <h1>Registration</h1>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Please enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Phone number" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Please enter your password" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="confirm-password">Confirm password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Please enter your password again" required>
                    </div>
                    <div class="form-group gender-group">
                        <label>Gender</label>
                        <div class="gender-options">
                            <label><input type="radio" name="gender" value="male" required> Male</label>
                            <label><input type="radio" name="gender" value="female"> Female</label>
                            <label><input type="radio" name="gender" value="other"> Other</label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="register-btn">Next Step</button>
                <p class="login-link">Already have an account? <a href="login.html">Sign in</a></p>
            </form>
        </div>
    </div>
    </div>
    <script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault(); // Prevent default form submission

    // Collect form data
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const gender = document.querySelector('input[name="gender"]:checked').value;

    // Send data to backend
    try {
        const response = await fetch('http://localhost:5000/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, email, password, gender })
        });
        const data = await response.json();
        alert(data.message || 'Registration successful!');
    } catch (err) {
        alert('Registration failed!');
    }
});
</script>
</body>
</html>
