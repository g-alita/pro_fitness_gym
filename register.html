<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Pro Fitness Gym</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="register-wrapper">
    <!-- LEFT: Image Slider -->
    <div class="register-image">
      <div class="slider">
        <div class="slides">
          <img src="/photos/abhishek.jpg" alt="img1">
          <img src="/photos/anjali.jpg" alt="img2">
          <img src="/photos/anupam.png" alt="img3">
          <img src="/photos/clean1.jpg" alt="img4">
          <img src="/photos/abhishek.jpg" alt="img1">
          <img src="/photos/anjali.jpg" alt="img2">
          <img src="/photos/anupam.png" alt="img3">
          <img src="/photos/clean1.jpg" alt="img4">
        </div>
        
      </div>
    </div>

    <!-- RIGHT: Registration Form -->
    <div class="register-form-container">
      <form class="register-form" id="registerForm">
        <h1>Registration</h1>

        <div class="form-row">
          <div class="form-group">
            <label for="name">Full Name*</label>
            <input type="text" id="name" name="name" placeholder="Please enter your name" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone number*</label>
            <input type="tel" id="phone" name="phone" placeholder="Phone number" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email*</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password*</label>
          <input type="password" id="password" name="password" placeholder="Please enter your password" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="confirm-password">Confirm password*</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Please enter your password again" required>
          </div>
        </div>

        <div class="form-group gender-group">
          <label>Gender*</label>
          <div class="gender-options">
            <label><input type="radio" name="gender" value="male" required> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="other"> Other</label>
          </div>
        </div>

        <div class="form-group">
          <label for="goal">Your Fitness Goal*</label>
          <select id="goal" required>
            <option value="">Select</option>
            <option value="weightloss">Weight Loss</option>
            <option value="muscle">Muscle Gain</option>
            <option value="fitness">General Fitness</option>
            <option value="cardio">Cardio Fitness</option>
            <option value="strenghttraining">Strength training</option>
            <option value="yoga">Yoga & Flexibility</option>
            <option value="zumba">Zumba</option>
          </select>
        </div>

        <div class="form-group">
    <label for="membership">Select Membership Plan*</label>
    <select id="membership" required>
      <option value="">Select Plan</option>
      <optgroup label="Gold Membership">
        <option value="gold-daily">Daily Pass – ₹100</option>
        <option value="gold-monthly">Monthly – ₹1800</option>
        <option value="gold-3month">3 Months – ₹3500</option>
        <option value="gold-6month">6 Months – ₹6500</option>
        <option value="gold-yearly">Yearly – ₹9000</option>
      </optgroup>
      <optgroup label="Platinum Membership">
        <option value="platinum-monthly">1 Month – ₹5200</option>
        <option value="platinum-3month">3 Months – ₹14500</option>
        <option value="platinum-6month">6 Months – ₹26000</option>
        <option value="platinum-yearly">1 Year – ₹45000</option>
      </optgroup>
    </select>
  </div>

  <button type="submit" class="register-btn">Submit</button>
  <a href="gym.html" class="home-btn">Return to Home</a>
        
      </form>
    </div>
  </div>

  <script>
    const slides = document.querySelector('.slides');
const slideImages = slides.children;
const total = slideImages.length;

// Clone first image at the end for seamless loop
const firstClone = slideImages[0].cloneNode(true);
slides.appendChild(firstClone);

let index = 0;
const slideWidth = slides.clientWidth / (total + 1); // width per image

function moveSlide() {
  index++;
  slides.style.transition = 'transform 0.8s ease-in-out';
  slides.style.transform = `translateX(-${index * 100}%)`;

  // When we reach the clone, reset without transition
  if (index === total) {
    setTimeout(() => {
      slides.style.transition = 'none';
      slides.style.transform = 'translateX(0)';
      index = 0;
    }, 800); // same as transition duration
  }
}

// Auto slide every 3 seconds
setInterval(moveSlide, 3000);



    // Registration Form Submission
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const gender = document.querySelector('input[name="gender"]:checked').value;

      try {
        const response = await fetch('http://localhost:5000/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, email, password, gender })
        });
        const data = await response.json();
        alert(data.message || 'Registration successful!');
      } catch {
        alert('Registration failed!');
      }
    });
  </script>
</body>
</html>
