<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Sign In - Pro Fitness Gym</title>
  <link rel="stylesheet" href="signin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div class="blur-overlay"></div>
  <div class="container">
    <div class="logo">
      <img src="photos/logo.png" alt="Pro Fitness Logo" style="width: 150px; height: auto;">
      <h1>Pro Fitness Gym</h1>
    </div>
    <h2><i class="fas fa-user-shield"></i> SIGN IN AS ADMIN</h2>

    <form class="signin-form" id="adminSignInForm">
      <input type="email" id="adminEmail" placeholder="Admin Email address" autocomplete="username" required />

      <div class="password-wrapper">
        <input type="password" placeholder="Admin Password" id="adminPassword" autocomplete="current-password" minlength="8" maxlength="128" required />
        <span class="toggle" onclick="togglePassword('adminPassword')">
          <i class="fas fa-eye" id="adminPasswordToggle"></i>
        </span>
      </div>

      <button type="submit">SIGN IN</button>
      <p id="passwordSignInStatus" class="auth-status" role="status" aria-live="polite"></p>

      <div class="google-signin-section">
        <div class="auth-divider"><span>OR</span></div>
        <div id="googleSignInButton"></div>
        <p id="googleSignInStatus" class="google-signin-status" role="status" aria-live="polite"></p>
      </div>

      <div class="links">
        <button type="button" class="link-button" id="requestPasswordLink">Set up / forgot password?</button>
        <p id="passwordSetupStatus" class="auth-status" role="status" aria-live="polite"></p>
        <p><a href="gym.html"><i class="fas fa-home"></i> Back to Home</a></p>
      </div>
    </form>
  </div>

  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const toggle = document.getElementById(inputId + 'Toggle');
      if (input.type === 'password') {
        input.type = 'text';
        toggle.classList.remove('fa-eye');
        toggle.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        toggle.classList.remove('fa-eye-slash');
        toggle.classList.add('fa-eye');
      }
    }

    document.getElementById('adminSignInForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const status = document.getElementById('passwordSignInStatus');
      status.textContent = 'Signing in...';

      try {
        const response = await fetch('/api/auth/password/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, accountType: 'admin' })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || 'Sign-in failed.');
        }

        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminEmail', result.email);
        localStorage.removeItem('userLoggedIn');
        window.location.href = 'admin.html';
      } catch (error) {
        console.error('Admin email/password sign-in failed:', error);
        status.textContent = error.message || 'Unable to sign in. Please try again.';
      }
    });

    document.getElementById('requestPasswordLink').addEventListener('click', async function() {
      const email = document.getElementById('adminEmail').value.trim();
      const status = document.getElementById('passwordSetupStatus');
      if (!email) {
        status.textContent = 'Enter your admin email address first.';
        return;
      }

      status.textContent = 'Requesting password setup email...';
      try {
        const response = await fetch('/api/auth/password/request-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, accountType: 'admin' })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || 'Unable to request a password setup email.');
        }
        status.textContent = result.message;
      } catch (error) {
        console.error('Admin password setup request failed:', error);
        status.textContent = error.message || 'Unable to request a password setup email.';
      }
    });

    function loadGoogleIdentityServices() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://accounts.google.com/gsi/client';
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Google sign-in could not be loaded. Please try again later.'));
        document.head.appendChild(script);
      });
    }

    async function handleGoogleCredential(response) {
      const status = document.getElementById('googleSignInStatus');
      status.textContent = 'Verifying your Google account...';

      try {
        const verificationResponse = await fetch('/api/auth/google/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const result = await verificationResponse.json();
        if (!verificationResponse.ok) {
          throw new Error(result.message || 'Google sign-in failed.');
        }

        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminEmail', result.email);
        localStorage.removeItem('userLoggedIn');
        window.location.href = 'admin.html';
      } catch (error) {
        console.error('Google admin sign-in failed:', error);
        status.textContent = error.message || 'Google sign-in failed. Please try again.';
      }
    }

    async function initializeGoogleSignIn() {
      const status = document.getElementById('googleSignInStatus');

      try {
        const configResponse = await fetch('/api/auth/google/config');
        const config = await configResponse.json();
        if (!configResponse.ok) {
          throw new Error(config.message || 'Google sign-in is not configured.');
        }

        await loadGoogleIdentityServices();
        google.accounts.id.initialize({
          client_id: config.clientId,
          callback: handleGoogleCredential
        });
        google.accounts.id.renderButton(document.getElementById('googleSignInButton'), {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          text: 'continue_with',
          shape: 'rectangular',
          logo_alignment: 'left',
          width: Math.min(300, document.getElementById('googleSignInButton').clientWidth)
        });
      } catch (error) {
        console.error('Unable to initialize Google admin sign-in:', error);
        status.textContent = error.message || 'Google sign-in could not be initialized.';
      }
    }

    initializeGoogleSignIn();
  </script>
</body>
</html>
