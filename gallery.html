<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Pro Fitness Gym</title>
  <link rel="stylesheet" href="gallery.css">
   <link rel="stylesheet" href="chatbot.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
  <nav>
    <span>
      <img src="photos/logo.png" alt="pro_fitness_logo" style="width: auto; height: 50px; display: block;">
    </span>

    <div class="hamburger" onclick="toggleMenu()">
      <i class="fas fa-bars"></i>
    </div>

    <ul class="nav-links">
      <a href="gym.html"><i class="fas fa-home"></i> Home</a>
      <a href="teams.html"><i class="fas fa-users"></i> Our Team</a>
      <a href="services.html"><i class="fas fa-dumbbell"></i> Services</a>
      <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
      <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
      <!-- <a href="signin.html"><i class="fas fa-sign-in-alt"></i> Sign In</a> -->
    </ul>
  </nav>

  <section class="gallery-section">
    <h1 class="heading">Our Gym Gallery</h1>
    <p class="sub-heading">Moments of sweat, strength, and success 💪</p>

    <div class="gallery">
      <img src="gallery/gym40.jpeg" alt="Workout Area">
      <img src="gallery/gym39.jpeg" alt="Cardio Zone">
      <img src="gallery/gym38.jpeg" alt="Zumba Session">
      <img src="gallery/gym37.jpeg" alt="Weight Training">
      <img src="gallery/gym36.jpeg" alt="Personal Training">
      <img src="gallery/gym35.jpeg" alt="Crossfit">
      <img src="gallery/gym34.jpeg" alt="Fitness Class">
      <img src="gallery/gym32.jpeg" alt="Members at Workout">
      <img src="gallery/gym30.jpeg" alt="Yoga Area">
      <img src="gallery/gym26.jpeg" alt="Workout Area">
      <img src="gallery/gym21.jpeg" alt="Cardio Zone">
      <img src="gallery/gym18.jpeg" alt="Zumba Session">
      <img src="gallery/gym17.jpeg" alt="Weight Training">
      <img src="gallery/gym16.jpeg" alt="Personal Training">
      <img src="gallery/gym15.jpeg" alt="Crossfit">
      <img src="gallery/gym11.jpeg" alt="Fitness Class">
      <img src="gallery/gym10.jpeg" alt="Members at Workout">
      <img src="gallery/gym5.jpeg" alt="Yoga Area">
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" src="" alt="Expanded Photo">
    <span class="caption"></span>
  </div>
 <div class="chat-button" onclick="toggleChat()">
            <i class="fas fa-comments"></i>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <div class="chat-header">
                <h3><i class="fas fa-dumbbell"></i> Pro Fitness Assistant</h3>
                <span class="close-btn" onclick="toggleChat()">×</span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-content">
                        👋 Hi! I'm your Pro Fitness virtual assistant. How can I help you today?
                    </div>
                </div>
            </div>

            <div class="quick-options" id="quickOptions">
                <button class="quick-btn" onclick="sendQuickMessage('membership')">Membership Plans</button>
                <button class="quick-btn" onclick="sendQuickMessage('timings')">Gym Timings</button>
                <button class="quick-btn" onclick="sendQuickMessage('trial')">Free Trial</button>
                <button class="quick-btn" onclick="sendQuickMessage('location')">Location</button>
            </div>

            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        <script src="chatbot.js"></script>
  <script src="gallery.js"></script>
</body>

</html>
