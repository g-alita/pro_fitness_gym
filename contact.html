<body>

    <nav>
            <span><img src="photos/logo.png" alt="pro_fitness_logo"
                    style="width: auto; height: 70px; display: block;"></span>
                    <div class="hamburger" onclick="toggleMenu()">

    <section class="contact-section">
        <h2>Contact Us</h2>
        <div class="contact-container">

            <!-- Left: Form -->
            <div class="contact-form">
                <form action="#" method="post">
                    <input type="text" placeholder="Your Name" required />
                    <input type="email" placeholder="Your Email" required />
                    <textarea rows="5" placeholder="Your Message" required></textarea>
                    <button type="submit">Send Message</button>
                </form>
                <div class="contact-info">
                    <h3>Pro Fitness Gym</h3>
                    <p><strong>Address:</strong> 123 Gym Street, FitCity</p>
                    <p><strong>Phone:</strong> +91 98765 43210</p>
                    <p><strong>Email:</strong> contact@profitness.com</p>
                    <p><strong>Instagram:</strong> <a
                            href="https://www.instagram.com/pro_fitness_gym_hazaribagh?utm_source=ig_web_button_share_sheet&igsh=bHMwOXpha2wyNmMx"
                            style="color: white; text-decoration: none;">pro_fitness_gym_hazaribagh</a></p>
                </div>
            </div>

            <!-- Right: Google Map -->
            <div class="contact-map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3644.9846538983!2d85.3774495!3d23.996319000000003!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39f49d59a0b7e583%3A0x15a5a210f247c401!2sPro%20Fitness%20Gym!5e0!3m2!1sen!2sin!4v1751479238971!5m2!1sen!2sin"
                    width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>

            </div>

        </div>
    </section>
